 # Decisions
 ssc_embrace_supreme_schemes_decision:0 "Embrace Supreme Schemes"
 ssc_embrace_supreme_schemes_decision_desc:0 "Accept the mantle of Supreme Schemer. Your plots finish in days, succeed near-certainly at High intensity, and unlock artifact theft and title intrigue schemes."
 ssc_embrace_supreme_schemes_decision_tooltip:0 "Gain the Supreme Schemer trait and High-intensity tempo package"
 ssc_embrace_supreme_schemes_decision_confirm:0 "Embrace Schemes"
 ssc_embrace_supreme_schemes_decision_effect_tt:0 "You become a Supreme Schemer"

 ssc_renounce_supreme_schemes_decision:0 "Renounce Supreme Schemes"
 ssc_renounce_supreme_schemes_decision_desc:0 "Lay down the Supreme Schemer mantle. Tempo modifiers and unique steal schemes go with it."
 ssc_renounce_supreme_schemes_decision_tooltip:0 "Remove the Supreme Schemer trait and turbo modifiers"
 ssc_renounce_supreme_schemes_decision_confirm:0 "Renounce"
