 # Events
 ssc_events.1001.t:0 "Supreme Schemer"
 ssc_events.1001.desc:0 "The web tightens around your fingers. Plots will finish in days, and at High intensity they functionally cannot fail."
 ssc_events.1001.a:0 "Excellent."

 ssc_events.1002.t:0 "Schemes Renounced"
 ssc_events.1002.desc:0 "You set aside the Supreme Schemer mantle. Tempo and theft schemes fade with it."
 ssc_events.1002.a:0 "So be it."

 ssc_events.2001.t:0 "Artifact Secured"
 ssc_events.2001.desc:0 "The piece is yours. If it was a Reliquary heirloom, never-lost magic may try to reclaim it later â€” intended soft conflict."
 ssc_events.2001.a:0 "Mine."

 ssc_events.2002.t:0 "Heist Foiled"
 ssc_events.2002.desc:0 "The attempt failed. They are watching more carefully."
 ssc_events.2002.a:0 "Annoying."

 ssc_events.2010.t:0 "Choose a Prize"
 ssc_events.2010.desc:0 "Which artifact will your agents pursue? Confirm the current pick, force an illustrious piece if any exist, or roll a random holding."
