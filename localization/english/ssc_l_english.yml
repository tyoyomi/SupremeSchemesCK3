 ssc_events.2010.c.tt:0 "Retarget a random artifact they hold"

 ssc_events.3001.t:0 "Claim Fabricated"
 ssc_events.3001.desc:0 "The parchment is sealed. Your claim on the title is ready."
 ssc_events.3001.a:0 "As planned."

 ssc_events.3002.t:0 "Forgery Failed"
 ssc_events.3002.desc:0 "The claim did not stick. Try again after the cooldown."
 ssc_events.3002.a:0 "Frustrating."

 ssc_events.3101.t:0 "Title Stolen"
 ssc_events.3101.desc:0 "Through intrigue alone, the title changes hands. Expect fury â€” and let succession settle itself."
 ssc_events.3101.a:0 "It is mine."

 ssc_events.3102.t:0 "Usurpation Failed"
 ssc_events.3102.desc:0 "The title remains theirs. The plot collapsed."
 ssc_events.3102.a:0 "Another time."

