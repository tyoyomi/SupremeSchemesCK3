l_english:
 # Trait
 trait_ssc_supreme_schemer:0 "Supreme Schemer"
 trait_ssc_supreme_schemer_desc:0 "Plots resolve in days, secrecy is absurd, and intrigue alone can steal artifacts and titles. Personal power stays below a Supreme Sovereign â€” the cheat is tempo and certainty."

 # Modifiers
 ssc_turbo_low_modifier:0 "Supreme Tempo (Low)"
 ssc_turbo_low_modifier_desc:0 "Mild scheme success, secrecy, and slots. Phases still finish far faster than vanilla on Supreme Schemes plots."
 ssc_turbo_med_modifier:0 "Supreme Tempo (Mid)"
 ssc_turbo_med_modifier_desc:0 "Strong scheme success, secrecy, and slots. Failures are rare."
 ssc_turbo_high_modifier:0 "Supreme Tempo (High)"
 ssc_turbo_high_modifier_desc:0 "Near-guaranteed success, extreme secrecy, and many concurrent schemes. Vanilla schemes also benefit; Supreme Schemes types finish in about three days."

 # Opinions
 ssc_stolen_title_opinion:0 "Stole my title"
 ssc_fabricated_claim_opinion:0 "Fabricated a claim on my title"
