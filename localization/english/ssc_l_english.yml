 ssc_settings.opt.cap_empire:0 "Cycle title cap (now Empire)"
 ssc_discover_secrets_interaction:0 "Discover Secrets"
 ssc_discover_secrets_interaction_desc:0 "As a Supreme Schemer, instantly learn every secret [recipient.GetShortUIName] still keeps from you. Wallhack intrigue — no scheme required."
 ssc_discover_secrets_interaction_extra_icon:0 "$"
